# 本地开发环境：仅 MySQL 8（任务 0 基线）。
# 用法：复制 .env.example 为 .env 并填好密码后执行 docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: patchme-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env 中设置 DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-patchme}
      MYSQL_USER: ${DB_USERNAME:-patchme_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 本机 JVM 使用东八区：让 DEFAULT CURRENT_TIMESTAMP 与应用侧 LocalDateTime.now() 同钟，
      # 否则限流窗口计数与相对时间展示都会偏移 8 小时。
      - --default-time-zone=+08:00
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - patchme_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  patchme_mysql_data:
