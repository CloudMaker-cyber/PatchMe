# 测试环境配置：排除数据源自动配置，使 mvn test 不依赖本地 MySQL。
# 上下文加载与 Web 层切片测试足以覆盖任务 0 的统一响应/异常框架。
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    # 测试专用密钥（>=32 字节），与任何环境无关
    secret: patchme-test-jwt-secret-please-never-use-in-prod-0123456789
    access-ttl: 1h
