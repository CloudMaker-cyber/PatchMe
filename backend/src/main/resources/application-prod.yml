# 生产 profile（SPRING_PROFILES_ACTIVE=prod）：
# 密钥/地址一律来自环境变量且无本地默认值——漏配直接启动失败，好过带着不安全默认上线。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    validate-on-migrate: true
    clean-disabled: true

app:
  cors:
    # 无默认值：生产必须显式声明前端源
    allowed-origins: ${APP_CORS_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:2h}
  cookie:
    # 生产只在 HTTPS 下回传 Cookie（见 docs/deploy-production.md 的 TLS 清单）
    secure: ${APP_COOKIE_SECURE:true}

# API 文档整体关闭：不对外暴露接口面
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info
    com.patchme: info
    org.springframework: warn
