spring:
  application:
    name: patchme-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:patchme}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  jwt:
    # 密钥只从环境变量注入；HS256 要求至少 32 字节
    secret: ${JWT_SECRET}
    access-ttl: 2h

logging:
  level:
    root: info
